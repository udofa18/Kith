# Supabase local development config for Kith
# See: https://supabase.com/docs/guides/local-development/cli/config

project_id = "kith"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.third_party.firebase]
enabled = true
project_id = "gen-lang-client-0475896362"

[storage]
enabled = true
file_size_limit = "50MiB"
